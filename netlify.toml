[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_SITE_URL = "https://mypupandme.co.uk"

# Custom domain configuration
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect Netlify subdomain to custom domain when configured
[[redirects]]
  from = "https://mypupandme.netlify.app/*"
  to = "https://mypupandme.co.uk/:splat"
  status = 301
  force = true

# Trailing slash consistency — no trailing slashes
[[redirects]]
  from = "/collection/"
  to = "/collection"
  status = 301

[[redirects]]
  from = "/size-guide/"
  to = "/size-guide"
  status = 301

[[redirects]]
  from = "/our-story/"
  to = "/our-story"
  status = 301

[[redirects]]
  from = "/journal/"
  to = "/journal"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms/"
  to = "/terms"
  status = 301

# SPA fallback for client-side routing (dynamic paths, 404 handling)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
